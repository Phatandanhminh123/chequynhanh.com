<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chè Quỳnh Anh - Thẻ Chip Rung Báo Hiệu</title>
    <style>
        body { background: #222; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 40px; }
        .chip-container { max-width: 400px; margin: 0 auto; background: #333; padding: 30px; border-radius: 20px; border: 4px solid #cc0066; }
        .vibrate-box { width: 120px; height: 120px; background: #555; border-radius: 50%; margin: 20px auto; line-height: 120px; font-size: 24px; font-weight: bold; color: #ffc107; border: 3px solid #ffc107; }
        .active-vibrate { background: #dc3545 !important; color: white !important; border-color: white !important; animation: shake 0.1s infinite, flash 0.5s infinite; }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -1px); } 60% { transform: translate(-2px, -2px); } 80% { transform: translate(2px, 1px); } }
        @keyframes flash { 0%, 100% { box-shadow: 0 0 10px #dc3545; } 50% { box-shadow: 0 0 30px #ffc107; } }
    </style>
</head>
<body>
<div class="chip-container">
    <h2 style="color:#cc0066; margin-top:0;">THẺ RUNG ĐIỆN TỬ CẦM TAY</h2>
    <div class="vibrate-box" id="chip_device">CHỜ MÓN</div>
    <p style="font-size:14px; color:#aaa; margin-top:20px;" id="chip_status">Hệ thống đang chờ lệnh từ nhà bếp...</p>
</div>
<script>
    let daKieu = [];
    function quetTrangThaiChip() {
        let orders = JSON.parse(localStorage.getItem('orders') || '[]'); let dangKieu = false;
        orders.forEach(o => {
            if(o.status === 'Mời nhận món (Kêu)' && !daKieu.includes(o.id)) {
                dangKieu = true; document.getElementById('chip_device').innerText = "#" + o.id;
                document.getElementById('chip_status').innerText = `🔔 THẺ ĐANG RUNG & KÊU TÍT TÍT! Mời Đơn #${o.id} lên quầy nhận đồ!`;
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator(); osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        });
        if(dangKieu) { document.getElementById('chip_device').classList.add('active-vibrate'); }
        else { document.getElementById('chip_device').classList.remove('active-vibrate'); document.getElementById('chip_device').innerText = "CHỜ MÓN"; document.getElementById('chip_status').innerText = "Hệ thống đang chờ lệnh từ nhà bếp..."; }
    }
    document.getElementById('chip_device').onclick = function() {
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');
        orders.forEach(o => { if(o.status === 'Mời nhận món (Kêu)') daKieu.push(o.id); }); quetTrangThaiChip();
    };
    setInterval(quetTrangThaiChip, 1500);
</script>
</body>
</html>
