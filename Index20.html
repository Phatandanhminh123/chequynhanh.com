<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống hiển thị mã bảo mật</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #39ff14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Giao diện nhập mật khẩu */
        #password-screen {
            text-align: center;
            background: #000;
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #ff3333;
            box-shadow: 0 0 15px #ff3333;
        }
        #password-screen h2 {
            color: #fff;
            margin-top: 0;
            font-family: Arial, sans-serif;
        }
        input {
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #39ff14;
            background: #222;
            color: #39ff14;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #39ff14;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        button:hover {
            background-color: #fff;
            box-shadow: 0 0 10px #39ff14;
        }
        #error-msg {
            color: #ff3333;
            margin-top: 10px;
            font-size: 14px;
        }
        /* Giao diện hiển thị mã */
        #display-screen {
            display: none; /* Ẩn đi lúc đầu */
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        #container {
            font-size: 24px;
            border: 2px solid #39ff14;
            padding: 20px;
            border-radius: 8px;
            background-color: #000;
            box-shadow: 0 0 15px #39ff14;
            margin-top: 20px;
            text-align: left; /* Căn lề trái để danh sách ngay ngắn */
            max-height: 70vh;
            overflow-y: auto; /* Tự động xuất hiện thanh cuộn nếu danh sách quá dài */
        }
        .code-item {
            margin-bottom: 10px;
            border-bottom: 1px dotted #333;
            padding-bottom: 5px;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH NHẬP MẬT KHẨU -->
    <div id="password-screen">
        <h2>HỆ THỐNG BẢO MẬT</h2>
        <p style="color: #aaa;">Vui lòng nhập mã truy cập để giải mã dữ liệu</p>
        <input type="password" id="pwd-input" placeholder="Nhập mật khẩu..." onkeydown="checkEnter(event)">
        <button onclick="verifyPassword()">XÁC NHẬN</button>
        <div id="error-msg"></div>
    </div>

    <!-- MÀN HÌNH HIỂN THỊ MÃ -->
    <div id="display-screen">
        <h2 style="color: #fff; font-family: Arial, sans-serif;">Dữ liệu đang được trích xuất...</h2>
        <div id="container"></div>
    </div>

    <script>
        // Danh sách mã bảo mật của bạn
        const danhSachMa = [
            "4qy3jkoh8","tw91p0bnh","jed9dldyk","mheznv9zv","z9ued12hr"
            "p3vq6oft7","wz6zky21i","2vjamfslg","ljxxj0et7","5twn1f9ri"
        ];

        let index = 0;
        let timer = null;

        // Hàm kiểm tra khi bấm phím Enter trong ô nhập
        function checkEnter(event) {
            if (event.key === "Enter") {
                verifyPassword();
            }
        }

        // Hàm xác minh mật khẩu
        function verifyPassword() {
            const inputVal = document.getElementById("pwd-input").value;
            const errorMsg = document.getElementById("error-msg");

            if (inputVal === "2105") {
                // Ẩn màn hình nhập mật khẩu, hiện màn hình hiển thị mã
                document.getElementById("password-screen").style.display = "none";
                document.getElementById("display-screen").style.display = "block";
                
                // Bắt đầu chạy trình hiển thị mã
                chayHienThi();
            } else {
                errorMsg.innerText = "❌ Sai mật khẩu! Vui lòng thử lại.";
                document.getElementById("pwd-input").value = "";
                document.getElementById("pwd-input").focus();
            }
        }

        // Hàm điều khiển hiển thị thêm từng mã sau mỗi 5 giây
        function chayHienThi() {
            const container = document.getElementById("container");

            function hienThiMoi() {
                if (index < danhSachMa.length) {
                    // Tạo một phần tử div mới cho mã tiếp theo
                    const newDiv = document.createElement("div");
                    newDiv.className = "code-item";
                    newDiv.innerText = `${index + 1}. ${danhSachMa[index]}`;
                    
                    // Thêm vào vùng chứa (giữ nguyên các mã cũ)
                    container.appendChild(newDiv);
                    
                    // Tự động cuộn xuống dưới cùng nếu danh sách quá dài
                    container.scrollTop = container.scrollHeight;
                    
                    index++;
                } else {
                    // Khi đã hiện hết toàn bộ mã thì dừng bộ đếm thời gian
                    clearInterval(timer);
                }
            }

            // Hiển thị ngay lập tức mã đầu tiên (mã số 1) sau khi mở khóa thành công
            hienThiMoi();

            // Cứ mỗi 5000ms (5 giây) sẽ chạy hàm để hiện thêm mã tiếp theo
            timer = setInterval(hienThiMoi, 5000);
        }
    </script>

</body>
</html>
