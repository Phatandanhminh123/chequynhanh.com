<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tiệm Chè Quỳnh Anh</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #fff5f5; margin: 0; padding-0; }
        header { background: #d63031; color: white; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 35px; text-transform: uppercase; }
        
        /* Thanh bật loa */
        #Banner { background: #ffeaa7; color: #d63031; padding: 15px; font-weight: bold; font-size: 18px; cursor: pointer; user-select: none; }
        
        /* Khu vực nhập liệu */
        .panel { background: white; padding: 20px; border-radius: 10px; margin: 20px auto; width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 10px; justify-content: center; align-items: center; border: 2px solid #fab1a0; }
        input { font-size: 20px; padding: 10px; border: 2px solid #ddd; border-radius: 5px; outline: none; }
        input:focus { border-color: #d63031; }
        #So { width: 120px; text-align: center; font-weight: bold; }
        #Mon { width: 250px; }
        button { font-size: 20px; padding: 10px 20px; background: #d63031; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #b32424; }

        /* Bảng hiển thị số lớn nền đỏ */
        .box { background: linear-gradient(135deg, #e17055, #d63031); border-radius: 15px; padding: 30px; color: white; width: 550px; margin: 20px auto; box-shadow: 0 8px 20px rgba(214,48,49,0.3); }
        .box h2 { margin: 0; font-size: 22px; text-transform: uppercase; color: #f5cd79; }
        #HienThiSo { font-size: 90px; font-weight: bold; margin: 15px 0; font-family: Courier; }
        #HienThiMon { font-size: 26px; background: rgba(0,0,0,0.15); padding: 8px 20px; border-radius: 20px; display: inline-block; }
    </style>
</head>
<body>

    <div id="Banner" onclick="MoLoa()">🔔 BẤM VÀO ĐÂY ĐỂ BẬT LOA QUÁN (CHỈ BẤM 1 LẦN) 🔔</div>
    
    <header>
        <h1>Tiệm Chè Quỳnh Anh</h1>
    </header>
    
    <div class="panel">
        <input type="number" id="So" placeholder="Nhập số..." autofocus>
        <input type="text" id="Mon" placeholder="Tên món ăn đã đặt...">
        <button onclick="GoiKhach()">GỌI MÓN</button>
    </div>

    <div class="box">
        <h2>Khách hàng có mã là</h2>
        <div id="HienThiSo">---</div>
        <div id="HienThiMon">Chưa có món</div>
    </div>

    <script>
        var loaCtx = null;
        function MoLoa() {
            loaCtx = new (window.AudioContext || window.webkitAudioContext)();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById("Banner").style.display = "none";
            document.getElementById("So").focus();
        }
        function ChuôngTingTing(callback) {
            if (!loaCtx) loaCtx = new (window.AudioContext || window.webkitAudioContext)();
            var o1 = loaCtx.createOscillator(), g1 = loaCtx.createGain();
            o1.frequency.setValueAtTime(600, loaCtx.currentTime); g1.gain.setValueAtTime(0.4, loaCtx.currentTime);
            g1.gain.exponentialRampToValueAtTime(0.001, loaCtx.currentTime + 0.3);
            o1.connect(g1); g1.connect(loaCtx.destination); o1.start(); o1.stop(loaCtx.currentTime + 0.3);
            setTimeout(function() {
                var o2 = loaCtx.createOscillator(), g2 = loaCtx.createGain();
                o2.frequency.setValueAtTime(900, loaCtx.currentTime); g2.gain.setValueAtTime(0.4, loaCtx.currentTime);
                g2.gain.exponentialRampToValueAtTime(0.001, loaCtx.currentTime + 0.4);
                o2.connect(g2); g2.connect(loaCtx.destination); o2.start(); o2.stop(loaCtx.currentTime + 0.4);
            }, 200);
            setTimeout(function() { if (callback) callback(); }, 700);
        }
        function GoiKhach() {
            if (!loaCtx) MoLoa();
            var oSo = document.getElementById("So"), oMon = document.getElementById("Mon");
            var txtSo = oSo.value.trim(), txtMon = oMon.value.trim();
            if (!txtSo) { alert("Chưa nhập số!"); return; }
            if (!txtMon) txtMon = "món ăn";
            
            document.getElementById("HienThiSo").innerHTML = "QA" + txtSo;
            document.getElementById("HienThiMon").innerHTML = txtMon;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            ChuôngTingTing(function() {
                if ('speechSynthesis' in window) {
                    var docSo = txtSo.split('').join(' ');
                    var cauNoi = "Khách hàng có mã Q A " + docSo + " với món ăn đã đặt là " + txtMon + " vui lòng đợi nhân viên mang ra";
                    var speech = new SpeechSynthesisUtterance(cauNoi);
                    speech.lang = "vi-VN"; speech.rate = 0.85;
                    var giong = window.speechSynthesis.getVoices().find(function(v) { return v.lang.includes('vi'); });
                    if (giong) speech.voice = giong;
                    window.speechSynthesis.speak(speech);
                }
            });
            oSo.value = ""; oMon.value = ""; oSo.focus();
        }
        document.getElementById("So").addEventListener("keypress", function(e) {
            if (e.key === "Enter") { e.preventDefault(); document.getElementById("Mon").focus(); }
        });
        document.getElementById("Mon").addEventListener("keypress", function(e) {
            if (e.key === "Enter") { e.preventDefault(); GoiKhach(); }
        });
    </script>
</body>
</html>
